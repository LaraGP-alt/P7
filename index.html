<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>P7 Grid</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bitcount+Ink:wght@100..900&family=Cinzel:wght@400..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Isometra&family=Michroma&family=Mulish:ital,wght@0,200..1000;1,200..1000&family=Redaction+50:ital,wght@0,400;0,700;1,400&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <style>
    :root {
      /* Colores */
      --lime: #CCFF02;
      --storm: #8696A8;
      --violet: #E4D2FC;
      --chilli: #EF432B;
      --dark: #282625;
      --light: #EFEAE8;
      --forest: #325444;

      /* Fuentes */
      --fuente-texto: Arial, sans-serif;
      --fuente-titulos: "Redaction 50", serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--fuente-texto);
      height: 100vh;
    }

    /* ---------- Grid ---------- */
    .grid {
      display: grid;
      grid-template-columns: 1.5fr 1.5fr 1fr;
      grid-template-rows: repeat(4, 1fr);
      width: 100%;
      height: 100%;
    }

    
    .lime   { grid-area: 1 / 1 / 2 / 2; }
    .storm  { grid-area: 2 / 1 / 3 / 2; }
    .violet { grid-area: 3 / 1 / 4 / 2; }
    .chilli { grid-area: 4 / 1 / 5 / 2; }

    .centro { grid-area: 1 / 2 / 5 / 3; }
    .forest { grid-area: 1 / 3 / 5 / 4; }

    .box {
      padding: 1vw 1.2vw;
      overflow: hidden;
    }
    .box p {
      font-size: 0.9vw;
      font-weight: 500;
      letter-spacing: 0.05em;
    }
    .box h1 {
      font-family: var(--fuente-titulos);
      font-weight: 400;
      font-style: normal;
      font-size: 7vw;
      line-height: 1;
      text-transform: uppercase;
    }

    /* ---------- Columna izquierda ---------- */
    .lime   { background: var(--lime);   color: var(--forest); }
    .storm  { background: var(--storm);  color: var(--light); }
    .violet { background: var(--violet); color: var(--chilli); }
    .chilli { background: var(--chilli); color: var(--light); }

    .lime p, .storm p, .violet p { color: var(--dark); }
    .chilli p { color: var(--light); }

    /* ---------- Columna central ---------- */
    .centro {
      display: flex;
      flex-direction: column;
    }
    .dark {
      background: var(--dark);
      color: var(--light);
      padding-bottom: 3vw;
      flex: 0 0 38%;
    }
    .dark p { color: var(--light); }
    .dark h1 { font-size: 8vw; }

    .light {
      background: var(--light);
      color: var(--dark);
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .light h1 {
      font-size: 6vw;
      margin-bottom: 1vw;
    }

    /* ---------- Columna derecha ---------- */
    .forest {
      background: var(--forest);
      color: var(--light);
      display: flex;
      flex-direction: column;
    }
    .forest p { color: var(--light); }
    .forest h1 {
      writing-mode: vertical-rl;
      font-size: 9vw;
      margin-top: 0.5vw;
    }
  </style>
</head>
<body>

  <main class="grid">
    <div class="box lime">
      <p>#CCFF02</p>
      <h1>Lime</h1>
    </div>
    <div class="box storm">
      <p>#8696A8</p>
      <h1>Storm</h1>
    </div>
    <div class="box violet">
      <p>#E4D2FC</p>
      <h1>Violet</h1>
    </div>
    <div class="box chilli">
      <p>#EF432B</p>
      <h1>Chilli</h1>
    </div>

    <div class="centro">
      <div class="box dark">
        <p>#282625</p>
        <h1>Dark</h1>
      </div>
      <div class="box light">
        <p>#EFEAE8</p>
        <h1>Light&amp;<br>Bright</h1>
      </div>
    </div>
    <div class="box forest">
      <p>#325444</p>
      <h1>Forest</h1>
    </div>

  </main>

</body>
</html>
